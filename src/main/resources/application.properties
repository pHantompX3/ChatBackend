quarkus.application.name=chat-backend

# HTTP
quarkus.http.host=127.0.0.1
quarkus.http.port=8080
quarkus.http.limits.max-body-size=32K
quarkus.jackson.fail-on-unknown-properties=true

# SQL Server (local container on localhost:1433)
quarkus.datasource.db-kind=mssql
quarkus.datasource.username=${WL_CHAT_DB_USERNAME:wl_chat_app}
quarkus.datasource.password=${WL_CHAT_DB_PASSWORD}
quarkus.datasource.jdbc.url=${WL_CHAT_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=wl_chat;encrypt=true;trustServerCertificate=true}

# Do not auto-start Testcontainers DB in dev; use existing local SQL Server
quarkus.datasource.devservices.enabled=false

# Flyway migrations are executed by repository scripts under scripts/database/flyway.
# Keep migrate-at-start off so the app does not depend on classpath migration resources.
quarkus.flyway.migrate-at-start=${WL_CHAT_FLYWAY_MIGRATE_AT_START:false}
quarkus.flyway.default-schema=platform
quarkus.flyway.schemas=platform,identity,messaging,audit
quarkus.flyway.table=flyway_schema_history

# Health
quarkus.datasource.health.enabled=true

# Logging baseline (console + rolling file)
quarkus.log.level=INFO
quarkus.log.console.json.enabled=true
quarkus.log.console.json.log-format=ecs

quarkus.log.file.enabled=true
quarkus.log.file.path=${WL_CHAT_LOG_DIR:logs}/chat_backend/chatback.log
quarkus.log.file.json.enabled=true
quarkus.log.file.json.log-format=ecs

# Time + size based rolling policy
# - Rolls at midnight using year-month-day suffix
# - Rolls early if file exceeds 50MB
# - Compressed archives (.gz)
# - Date-based naming, e.g. logs/chat_backend/chatback.log.2026-07-07.gz
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd.gz
quarkus.log.file.rotation.max-file-size=50M
quarkus.log.file.rotation.max-backup-index=365
quarkus.log.file.rotation.rotate-on-boot=false

# Dedicated HTTP/audit transport log file to prevent chatback.log from growing too noisy.
quarkus.log.handler.file.http-audit.enabled=true
quarkus.log.handler.file.http-audit.path=${WL_CHAT_LOG_DIR:logs}/chat_backend/http-audit.log
quarkus.log.handler.file.http-audit.format=%s%n
quarkus.log.handler.file.http-audit.level=INFO
quarkus.log.handler.file.http-audit.rotation.file-suffix=.yyyy-MM-dd.gz
quarkus.log.handler.file.http-audit.rotation.max-file-size=50M
quarkus.log.handler.file.http-audit.rotation.max-backup-index=365
quarkus.log.handler.file.http-audit.rotation.rotate-on-boot=false

# Route HTTP request/audit transport categories to the dedicated file only.
quarkus.log.category."com.wayden.messenger.common.http".level=INFO
quarkus.log.category."com.wayden.messenger.common.http.HttpAuditFilter".handlers=http-audit
quarkus.log.category."com.wayden.messenger.common.http.HttpAuditFilter".use-parent-handlers=true

# HTTP audit queue
chat.audit.async.enabled=${WL_CHAT_AUDIT_ASYNC_ENABLED:true}
chat.audit.async.queue-capacity=${WL_CHAT_AUDIT_QUEUE_CAPACITY:1024}
chat.audit.rabbitmq.enabled=${WL_CHAT_AUDIT_RABBITMQ_ENABLED:false}
chat.audit.rabbitmq.host=${WL_CHAT_AUDIT_RABBITMQ_HOST:localhost}
chat.audit.rabbitmq.host-candidates=${WL_CHAT_AUDIT_RABBITMQ_HOST_CANDIDATES:}
chat.audit.rabbitmq.port=${WL_CHAT_AUDIT_RABBITMQ_PORT:5672}
chat.audit.rabbitmq.username=${WL_CHAT_AUDIT_RABBITMQ_USERNAME:wl_chat_queue}
chat.audit.rabbitmq.password=${WL_CHAT_AUDIT_RABBITMQ_PASSWORD:}
chat.audit.rabbitmq.vhost=${WL_CHAT_AUDIT_RABBITMQ_VHOST:/}
chat.audit.rabbitmq.exchange=${WL_CHAT_AUDIT_RABBITMQ_EXCHANGE:audit.events}
chat.audit.rabbitmq.routing-key=${WL_CHAT_AUDIT_RABBITMQ_ROUTING_KEY:audit.completed}
chat.audit.rabbitmq.queue=${WL_CHAT_AUDIT_RABBITMQ_QUEUE:audit.events}
chat.audit.rabbitmq.consumer.enabled=${WL_CHAT_AUDIT_RABBITMQ_CONSUMER_ENABLED:true}
chat.audit.rabbitmq.consumer.prefetch=${WL_CHAT_AUDIT_RABBITMQ_CONSUMER_PREFETCH:25}
%test.chat.audit.async.enabled=false
%test.chat.audit.async.queue-capacity=128
%test.chat.audit.rabbitmq.enabled=false
%test.quarkus.log.console.json.enabled=false
%test.quarkus.log.file.json.enabled=false
%test.quarkus.http.test-port=0

# OpenAPI
quarkus.smallrye-openapi.info-title=ChatBackend API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=Private messaging backend API
quarkus.swagger-ui.always-include=false
quarkus.smallrye-openapi.store-schema-directory=target/generated-openapi

# Shared login abuse throttling. Counters contain hashes only and are authoritative in SQL Server.
chat.auth.rate-limit.enabled=true
chat.auth.rate-limit.account-limit=10
chat.auth.rate-limit.account-window=PT5M
chat.auth.rate-limit.source-limit=30
chat.auth.rate-limit.source-window=PT1M
%test.chat.auth.rate-limit.enabled=false

# Optional comma-separated immediate proxy IPs or CIDRs allowed to supply forwarding headers.
# Leave unset when clients connect directly. Environment override: CHAT_HTTP_TRUSTED_PROXIES.

# Dev-mode terminal detach/shutdown can spam Aesh warnings (stty/Input-output error).
# Keep app/audit logs at INFO, but suppress noisy dev console internals in dev only.
%dev.quarkus.log.category."org.aesh".level=ERROR
%dev.quarkus.log.category."io.quarkus.deployment.console".level=ERROR
%dev.quarkus.log.category."io.quarkus.dev.console".level=ERROR
