name: DB Local Bootstrap And Migrate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  bootstrap-and-migrate:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
          MSSQL_SA_PASSWORD: "${{ secrets.WL_CHAT_SQL_SA_PASSWORD }}"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/bin/bash -c 'echo > /dev/tcp/127.0.0.1/1433'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    env:
      SA_PASSWORD: ${{ secrets.WL_CHAT_SQL_SA_PASSWORD }}
      APP_LOGIN: wl_chat_app
      APP_PASSWORD: ${{ secrets.WL_CHAT_APP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Wait for SQL Server
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest | head -n 1)
          if [[ -z "$container_id" ]]; then
            echo "SQL Server service container not found"
            exit 1
          fi

          for i in {1..90}; do
            if docker exec "$container_id" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is ready"
              exit 0
            fi
            echo "Waiting for SQL Server... ($i/90)"
            sleep 2
          done

          echo "SQL Server did not become ready in time"
          docker logs "$container_id" || true
          exit 1

      - name: Bootstrap wl_chat database
        run: |
          docker run --rm --network host \
            -v "$PWD/scripts/database/flyway/master:/flyway/sql" \
            flyway/flyway:10.17.3 \
            -url="jdbc:sqlserver://localhost:1433;databaseName=master;encrypt=true;trustServerCertificate=true" \
            -user="sa" \
            -password="${SA_PASSWORD}" \
            -locations="filesystem:/flyway/sql" \
            migrate

      - name: Run Flyway migrations
        run: |
          docker run --rm --network host \
            -v "$PWD/scripts/database/flyway/wl_chat:/flyway/sql" \
            flyway/flyway:10.17.3 \
            -url="jdbc:sqlserver://localhost:1433;databaseName=wl_chat;encrypt=true;trustServerCertificate=true" \
            -user="sa" \
            -password="${SA_PASSWORD}" \
            -locations="filesystem:/flyway/sql" \
            -defaultSchema="platform" \
            -schemas="platform,identity,messaging,audit" \
            -table="flyway_schema_history" \
            -placeholders.app_login="${APP_LOGIN}" \
            -placeholders.app_password="${APP_PASSWORD}" \
            migrate

      - name: Verify app login connectivity
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest | head -n 1)
          docker exec "$container_id" /opt/mssql-tools18/bin/sqlcmd -S localhost -U "$APP_LOGIN" -P "$APP_PASSWORD" -C -d wl_chat -b -Q "SELECT DB_NAME() AS database_name, SUSER_SNAME() AS login_name;"

      - name: Verify logical schemas and Flyway history placement
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest | head -n 1)

          schema_count=$(docker exec "$container_id" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -d wl_chat -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.schemas WHERE name IN ('platform','identity','messaging','audit');" | tr -d '\r' | xargs)
          if [[ "$schema_count" != "4" ]]; then
            echo "Expected 4 logical schemas but found: $schema_count"
            exit 1
          fi

          history_schema=$(docker exec "$container_id" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -d wl_chat -h -1 -W -Q "SET NOCOUNT ON; SELECT TOP 1 s.name FROM sys.tables t JOIN sys.schemas s ON s.schema_id = t.schema_id WHERE t.name = 'flyway_schema_history';" | tr -d '\r' | xargs)
          if [[ "$history_schema" != "platform" ]]; then
            echo "Expected flyway_schema_history in platform schema but found: '$history_schema'"
            exit 1
          fi

      - name: Verify runtime principal DDL denial
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest | head -n 1)

          set +e
          docker exec "$container_id" /opt/mssql-tools18/bin/sqlcmd -S localhost -U "$APP_LOGIN" -P "$APP_PASSWORD" -C -d wl_chat -b -Q "CREATE TABLE dbo.__ci_forbidden (id INT NOT NULL);"
          ddl_exit=$?
          set -e

          if [[ $ddl_exit -eq 0 ]]; then
            echo "Runtime principal unexpectedly succeeded in CREATE TABLE"
            exit 1
          fi

      - name: Build and verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
