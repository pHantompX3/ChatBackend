name: DB Remote Migrate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-db-remote-bootstrap-migrate
  cancel-in-progress: true

jobs:
  migrate-remote:
    runs-on: ubuntu-latest
    environment: dev
    env:
      DB_URL: ${{ secrets.WL_CHAT_REMOTE_SQL_URL }}
      MIGRATOR_USERNAME: ${{ secrets.WL_CHAT_REMOTE_MIGRATOR_USERNAME }}
      MIGRATOR_PASSWORD: ${{ secrets.WL_CHAT_REMOTE_MIGRATOR_PASSWORD }}
      APP_LOGIN: ${{ vars.WL_CHAT_REMOTE_APP_LOGIN || 'wl_chat_app' }}
      FLYWAY_IMAGE: ${{ vars.WL_CHAT_REMOTE_FLYWAY_IMAGE }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate Flyway migration naming
        shell: bash
        run: ./scripts/database/validate-flyway-naming.sh

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Check remote secret readiness
        id: remote_secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DB_URL}" && -n "${MIGRATOR_USERNAME}" && -n "${MIGRATOR_PASSWORD}" \
            && "${FLYWAY_IMAGE}" == *@sha256:* ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Remote migrator settings are not fully configured; refusing remote migration."
            exit 1
          fi

      - name: Run reviewed Flyway migrations as migrator
        if: steps.remote_secrets.outputs.ready == 'true'
        run: |
          docker run --rm \
            -v "$PWD/scripts/database/flyway/wl_chat:/flyway/sql:ro" \
            "${FLYWAY_IMAGE}" \
            -url="${DB_URL}" \
            -user="${MIGRATOR_USERNAME}" \
            -password="${MIGRATOR_PASSWORD}" \
            -locations="filesystem:/flyway/sql" \
            -defaultSchema="platform" \
            -schemas="platform,identity,messaging,audit" \
            -table="flyway_schema_history" \
            -placeholders.app_login="${APP_LOGIN}" \
            -placeholders.app_password="unused-preprovisioned-runtime-password" \
            migrate
