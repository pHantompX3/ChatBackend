name: DB Remote Bootstrap And Migrate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-db-remote-bootstrap-migrate
  cancel-in-progress: true

jobs:
  bootstrap-and-migrate-remote:
    runs-on: ubuntu-latest
    environment: dev
    env:
      DB_HOST: ${{ secrets.WL_CHAT_REMOTE_SQL_HOST }}
      DB_PORT: ${{ secrets.WL_CHAT_REMOTE_SQL_PORT }}
      SA_PASSWORD: ${{ secrets.WL_CHAT_REMOTE_SQL_SA_PASSWORD }}
      APP_LOGIN: wl_chat_app
      APP_PASSWORD: ${{ secrets.WL_CHAT_REMOTE_APP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Flyway migration naming
        shell: bash
        run: ./scripts/database/validate-flyway-naming.sh

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Check remote secret readiness
        id: remote_secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DB_HOST}" && -n "${DB_PORT}" && -n "${SA_PASSWORD}" && -n "${APP_PASSWORD}" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Remote SQL secrets are not fully configured; skipping remote bootstrap/migrate."
          fi

      - name: Bootstrap wl_chat database on remote SQL Server
        if: steps.remote_secrets.outputs.ready == 'true'
        run: |
          docker run --rm \
            -v "$PWD/scripts/database/flyway/master:/flyway/sql" \
            flyway/flyway:10.17.3 \
            -url="jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=master;encrypt=true;trustServerCertificate=true" \
            -user="sa" \
            -password="${SA_PASSWORD}" \
            -locations="filesystem:/flyway/sql" \
            migrate

      - name: Run Flyway migrations on remote SQL Server
        if: steps.remote_secrets.outputs.ready == 'true'
        run: |
          docker run --rm \
            -v "$PWD/scripts/database/flyway/wl_chat:/flyway/sql" \
            flyway/flyway:10.17.3 \
            -url="jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=wl_chat;encrypt=true;trustServerCertificate=true" \
            -user="sa" \
            -password="${SA_PASSWORD}" \
            -locations="filesystem:/flyway/sql" \
            -defaultSchema="platform" \
            -schemas="platform,identity,messaging,audit" \
            -table="flyway_schema_history" \
            -placeholders.app_login="${APP_LOGIN}" \
            -placeholders.app_password="${APP_PASSWORD}" \
            migrate
