name: Security Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sbom-and-dependency-review:
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify and generate CycloneDX SBOM
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: OWASP dependency check
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests -Psecurity-scan verify

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-security-evidence
          if-no-files-found: warn
          path: |
            target/bom.json
            target/bom.xml
            target/dependency-check-report.*

  image-filesystem-and-secret-scan:
    runs-on: ubuntu-latest
    env:
      WL_CHAT_TEMURIN_JDK_IMAGE: eclipse-temurin:25-jdk@sha256:e787e08ef76f4c16866108cd7f9fcd96a68eef3ac6cc76866897d4d02d5a2262
      WL_CHAT_TEMURIN_JRE_IMAGE: eclipse-temurin:25-jre-jammy@sha256:10c251954d0bfe1a59ba93505f8c628d755919412400aa98685764c9353605d6
      WL_CHAT_TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
      WL_CHAT_FLYWAY_BASE_IMAGE: flyway/flyway:13.3.0-alpine@sha256:fb13953f16913efd313f202ec4b4ed34fd2ea14cc51401eb36ea9818c0df2918
      WL_CHAT_BUILD_IMAGE_TAG: chat-backend:security-scan
      WL_CHAT_SCAN_IMAGE: chat-backend:security-scan
      WL_CHAT_MIGRATION_BUILD_IMAGE_TAG: chat-backend-flyway:security-scan
      WL_CHAT_SCAN_MIGRATION_IMAGE: chat-backend-flyway:security-scan
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build and assert hardened application image
        run: ./scripts/ci/build-image.sh

      - name: Build and assert SQL Server-only migration image
        run: ./scripts/ci/build-migration-image.sh

      - name: Scan repository and application image
        run: ./scripts/ci/scan.sh

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-and-source-security-evidence
          if-no-files-found: error
          path: security-reports/*.json
