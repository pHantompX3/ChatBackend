upstream chat_backend {
  server app:8080;
  keepalive 32;
}

server {
  listen 8080;
  return 308 https://$host$request_uri;
}

server {
  listen 8443 ssl;
  http2 on;

  ssl_certificate /etc/nginx/tls/proxy.crt;
  ssl_certificate_key /etc/nginx/tls/proxy.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:TLS:10m;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = /health/live {
    proxy_pass http://chat_backend/q/health/live;
    include /etc/nginx/proxy_params;
  }

  location = /health/ready {
    proxy_pass http://chat_backend/q/health/ready;
    include /etc/nginx/proxy_params;
  }

  location ^~ /q/ {
    return 404;
  }

  location = /api/v1/ws {
    limit_conn per_client 10;
    proxy_pass http://chat_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 75s;
    proxy_send_timeout 30s;
    include /etc/nginx/proxy_params;
  }

  location / {
    limit_req zone=api_rate burst=60 nodelay;
    limit_conn per_client 20;
    proxy_pass http://chat_backend;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    include /etc/nginx/proxy_params;
  }
}
