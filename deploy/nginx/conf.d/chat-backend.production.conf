upstream chat_backend_production {
  server app:8080;
  keepalive 32;
}

server {
  listen 8443 ssl;
  http2 on;
  server_name chat-api.wmkjsolutions.com;

  set_real_ip_from 172.31.90.0/24;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  ssl_certificate /etc/nginx/tls/origin.crt;
  ssl_certificate_key /etc/nginx/tls/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:TLS:10m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control "no-store" always;

  location = /health/live {
    access_log off;
    proxy_pass http://chat_backend_production/q/health/live;
    include /etc/nginx/proxy_params;
  }

  location = /health/ready {
    return 404;
  }

  location ^~ /q/ {
    return 404;
  }

  location = /api/v1/ws {
    limit_req zone=websocket_handshake burst=5 nodelay;
    limit_conn per_client 4;
    proxy_pass http://chat_backend_production;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 75s;
    proxy_send_timeout 30s;
    include /etc/nginx/proxy_params;
  }

  location / {
    limit_req zone=api_rate burst=30 nodelay;
    limit_conn per_client 12;
    proxy_pass http://chat_backend_production;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    include /etc/nginx/proxy_params;
  }
}

server {
  listen 8443 ssl default_server;
  server_name _;
  ssl_certificate /etc/nginx/tls/origin.crt;
  ssl_certificate_key /etc/nginx/tls/origin.key;
  return 444;
}
