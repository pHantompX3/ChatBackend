worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format wl_chat escape=json
    '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
    '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration":$request_time,"traceId":"$wl_trace_id"}';
  access_log /dev/stdout wl_chat;
  error_log /dev/stderr warn;

  map $http_x_trace_id $wl_trace_id {
    "~^[A-Za-z0-9._-]{1,128}$" $http_x_trace_id;
    default $request_id;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  limit_req_zone $binary_remote_addr zone=api_rate:10m rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=per_client:10m;

  server_tokens off;
  client_max_body_size 32k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 30s;
  send_timeout 30s;

  include /etc/nginx/conf.d/*.conf;
}
