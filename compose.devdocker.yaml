name: wl-chat-devdocker

services:
  queue-dev:
    image: rabbitmq:3.13-management
    container_name: wl-chat-queue-dev
    environment:
      RABBITMQ_DEFAULT_USER: ${WL_CHAT_QUEUE_USERNAME:-wl_chat_queue}
      RABBITMQ_DEFAULT_PASS: ${WL_CHAT_QUEUE_PASSWORD:?WL_CHAT_QUEUE_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: ${WL_CHAT_QUEUE_VHOST:-/}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >-
        -rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"
    ports:
      - target: 5672
        published: ${WL_CHAT_QUEUE_PORT:-5672}
        protocol: tcp
        host_ip: ${WL_CHAT_QUEUE_HOST_IP:-0.0.0.0}
      - target: 15672
        published: ${WL_CHAT_QUEUE_MGMT_PORT:-15672}
        protocol: tcp
        host_ip: ${WL_CHAT_QUEUE_MGMT_HOST_IP:-127.0.0.1}
    volumes:
      - wl-chat-devdocker-rabbitmq-data:/var/lib/rabbitmq
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./config/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  sqlserver-dev:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wl-chat-sqlserver-dev
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
    ports:
      - "127.0.0.1:1434:1433"
    volumes:
      - wl-chat-devdocker-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" > /dev/null || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  app-dev:
    image: ${WL_CHAT_APP_IMAGE:-wl-chat-app-dev:latest}
    container_name: wl-chat-app-devdocker
    environment:
      WL_CHAT_DB_URL: jdbc:sqlserver://sqlserver-dev:1433;databaseName=wl_chat;encrypt=true;trustServerCertificate=true
      WL_CHAT_DB_USERNAME: ${WL_CHAT_DB_USERNAME:-wl_chat_app}
      WL_CHAT_DB_PASSWORD: ${WL_CHAT_DB_PASSWORD:?WL_CHAT_DB_PASSWORD is required}
      WL_CHAT_FLYWAY_MIGRATE_AT_START: "false"
      WL_CHAT_FLYWAY_USERNAME: sa
      WL_CHAT_FLYWAY_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
      WL_CHAT_AUDIT_RABBITMQ_ENABLED: ${WL_CHAT_AUDIT_RABBITMQ_ENABLED:-true}
      WL_CHAT_AUDIT_RABBITMQ_HOST: ${WL_CHAT_AUDIT_RABBITMQ_HOST:-queue-dev}
      WL_CHAT_AUDIT_RABBITMQ_HOST_CANDIDATES: ${WL_CHAT_AUDIT_RABBITMQ_HOST_CANDIDATES:-}
      WL_CHAT_AUDIT_RABBITMQ_PORT: ${WL_CHAT_AUDIT_RABBITMQ_PORT:-5672}
      WL_CHAT_AUDIT_RABBITMQ_USERNAME: ${WL_CHAT_AUDIT_RABBITMQ_USERNAME:-${WL_CHAT_QUEUE_USERNAME:-wl_chat_queue}}
      WL_CHAT_AUDIT_RABBITMQ_PASSWORD: ${WL_CHAT_AUDIT_RABBITMQ_PASSWORD:-${WL_CHAT_QUEUE_PASSWORD:?WL_CHAT_QUEUE_PASSWORD is required}}
      WL_CHAT_AUDIT_RABBITMQ_VHOST: ${WL_CHAT_AUDIT_RABBITMQ_VHOST:-${WL_CHAT_QUEUE_VHOST:-/}}
      WL_CHAT_AUDIT_RABBITMQ_EXCHANGE: ${WL_CHAT_AUDIT_RABBITMQ_EXCHANGE:-audit.events}
      WL_CHAT_AUDIT_RABBITMQ_ROUTING_KEY: ${WL_CHAT_AUDIT_RABBITMQ_ROUTING_KEY:-audit.completed}
      WL_CHAT_AUDIT_RABBITMQ_QUEUE: ${WL_CHAT_AUDIT_RABBITMQ_QUEUE:-audit.events}
      WL_CHAT_AUDIT_RABBITMQ_CONSUMER_ENABLED: ${WL_CHAT_AUDIT_RABBITMQ_CONSUMER_ENABLED:-true}
    ports:
      - "127.0.0.1:${WL_CHAT_APP_PORT:-8081}:8080"
    depends_on:
      sqlserver-dev:
        condition: service_healthy
    restart: unless-stopped

volumes:
  wl-chat-devdocker-sqlserver-data:
  wl-chat-devdocker-rabbitmq-data:
